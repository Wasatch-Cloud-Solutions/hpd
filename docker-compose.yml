services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hiddenpeak
      POSTGRES_PASSWORD: hiddenpeak
      POSTGRES_DB: hiddenpeak
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiddenpeak -d hiddenpeak"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
volumes:
  postgres-data:
  redis-data:
