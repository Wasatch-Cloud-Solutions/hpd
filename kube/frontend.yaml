apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: techwmarcus/hpp-frontend:v0.3
          ports:
            - name: http
              protocol: TCP
              containerPort: 80
          envFrom:
            - secretRef:
                name: hpp-secrets
          command: ["/bin/sh", "-c"]
          args:
          - |
            echo "Replacing 'test' placeholder with live envFrom value..."
            sed -i "s|test|${EXPO_PUBLIC_API_URL}|g" /usr/share/nginx/html/_expo/static/js/*.js
            
            echo "Starting web server..."
            nginx -g "daemon off;"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: prod
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80