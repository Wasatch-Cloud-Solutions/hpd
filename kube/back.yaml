apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: prisma-migrate
          image: techwmarcus/hpp-api:v1
          workingDir: /app
          command:
            - npx
            - prisma
            - migrate
            - deploy
            - --schema
            - services/api/prisma/schema.prisma
          envFrom:
            - secretRef:
                name: hpp-secrets
        - name: prisma-seed
          image: techwmarcus/hpp-api:v1
          workingDir: /app/services/api
          command:
            - node
            - dist-seed/seed.js
          envFrom:
            - secretRef:
                name: hpp-secrets

      containers:
        - name: backend
          image: techwmarcus/hpp-api:v1
          ports:
            - name: metrics 
              containerPort: 9090
            - name: http
              containerPort: 3000     
          envFrom:
            - secretRef:
                name: hpp-secrets

              
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: prod
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-monitor
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: metrics          # <-- Must match spec.ports[].name in the Service
      path: /metrics
      interval: 15s
