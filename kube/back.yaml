apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: prisma-migrate
          image: techwmarcus/hpp-api:v0.5
          workingDir: /app
          command:
            - npx
            - prisma
            - migrate
            - deploy
            - --schema
            - services/api/prisma/schema.prisma
          envFrom:
            - secretRef:
                name: hpp-secrets


      containers:
        - name: backend
          image: techwmarcus/hpp-api:v0.9
          ports:
            - containerPort: 3000     
          envFrom:
            - secretRef:
                name: hpp-secrets

              
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: prod
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
