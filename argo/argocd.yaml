apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hpp
  namespace: argocd
spec:
  project: default
  source: 
    repoURL: https://github.com/Wasatch-Cloud-Solutions/hpd.git
    targetRevision: main
    path: kube
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true